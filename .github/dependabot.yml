# Weekly dependency updates, grouped so they arrive as a few PRs instead of one per package.
# CI (astro check, worker type-check, build, link check, Lighthouse) runs on each PR; Workers Builds adds a preview URL.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Asia/Kuala_Lumpur
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns: ["astro", "@astrojs/*", "shiki", "@shikijs/*"]
      cloudflare:
        patterns: ["wrangler", "@cloudflare/*"]
      dev-tooling:
        patterns: ["typescript", "turndown*"]
        dependency-type: development
      fonts:
        patterns: ["@fontsource-variable/*"]
    ignore:
      # Major bumps of the framework and the Worker toolchain are reviewed by hand (config and API changes).
      - dependency-name: astro
        update-types: ["version-update:semver-major"]
      - dependency-name: wrangler
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
